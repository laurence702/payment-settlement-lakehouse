name: e2e

# The full stack, under the same per-container mem_limit caps as the laptop.
# The runner has more RAM than the 6 GB Colima VM, but mem_limit is enforced
# per container by cgroups, so an OOM kill here is the same OOM kill there.
#
# Automated end-to-end verification: runs make verify, generates summary,
# and publishes the verify-report artifact for test verification.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker-compose.yml
      - .env.example
      - docker/**
      - dags/**
      - src/**
      - dbt/**
      - sql/**
      - config/**
      - init-scripts/**
      - scripts/**
      - Makefile
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap .env
        run: make bootstrap

      - name: Build airflow image
        run: make build

      - name: make verify
        run: make verify

      - name: Summary
        if: always()
        run: |
          [ -f verify-report/summary.md ] && cat verify-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: make down || true
