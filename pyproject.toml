[project]
name = "settlement"
version = "0.1.0"
description = "Payment settlement reconciliation lakehouse"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: needs a JVM (PySpark) or dbt. Excluded by default: `pytest -m 'not slow'`",
    "e2e: drives the running stack through Airflow's UI. Lives in e2e/, run with `make e2e`.",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
