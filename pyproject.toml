[project]
name = "naijapay"
version = "0.1.0"
description = "Nigerian payments settlement reconciliation lakehouse"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: needs a JVM (PySpark) or dbt. Excluded by default: `pytest -m 'not slow'`",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
