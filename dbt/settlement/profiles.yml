# Checked in on purpose: no secrets, only env_var lookups. Real credentials come
# from the Airflow container's environment.
settlement:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    # Normal path: DuckDB reading and writing the S3 object store over httpfs.
    local:
      type: duckdb
      # Ephemeral catalog. All persistent state is Parquet in object storage; this file
      # is scratch and safe to delete between runs. That is what stops DuckDB
      # from becoming a single-writer bottleneck pretending to be a warehouse.
      path: "{{ env_var('DBT_DUCKDB_PATH', '/tmp/settlement.duckdb') }}"
      # Threads: 2 instead of 4. dbt_build runs inside the Airflow scheduler
      # container (MEM_AIRFLOW_SCHEDULER=2048m). The scheduler baseline is
      # ~720 MB; the remaining ~1.3 GB is shared with DuckDB. Fewer threads
      # means fewer parallel operator pipelines and a lower peak RSS.
      threads: 2
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'seaweedfs:8333') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY', 'dataeng') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY', 'dataeng_local_only') }}"
        s3_use_ssl: false
        s3_url_style: path
        # Hard cap DuckDB's allocator to what the cgroup actually allows.
        # Without this, DuckDB asks the OS for 80% of the *VM* total (5.77 GiB),
        # which far exceeds the scheduler container's 2 GiB cgroup ceiling.
        # Confirmed via dmesg: dbt killed at anon-rss ~1.43 GB at 500k-event scale.
        # 1100 MB = 2048 (cgroup) - 720 (scheduler baseline) - 228 (safety margin).
        memory_limit: "1100MB"

    # No object store, no httpfs, no network. Used by `make test-dbt` to build
    # and test every model against a directory of local Parquet, which is what
    # makes the SQL testable in CI without standing up an object store.
    localfs:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '/tmp/settlement.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "1100MB"
